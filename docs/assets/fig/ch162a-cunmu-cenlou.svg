  <line x1="579.0" y1="404" x2="579.0" y2="398" stroke="#8C7B69" stroke-width="0.96"/>
  <text x="520" y="424" text-anchor="middle" font-size="5.8" letter-spacing="2" fill="#7C6D5C" font-weight="400">岑 楼</text>
