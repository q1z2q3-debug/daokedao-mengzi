  <text x="560" y="240" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#994433" font-weight="400">方寸之木</text>
  <line x1="160" y1="262" x2="660" y2="262" stroke="#DCD5C8" stroke-width="0.9"/>
  <text x="196" y="254" text-anchor="middle" font-size="5.2" letter-spacing="0" fill="#BFB4A4" font-weight="400">齐 其 末</text>
  <line x1="160" y1="404" x2="160" y2="262" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="150" y="340" text-anchor="middle" font-size="6.0" letter-spacing="0" fill="#BFB4A4" font-weight="400">本</text>
  <path d="M 250,300 L 250,404" fill="none" stroke="#DCD5C8" stroke-width="0.8" stroke-dasharray="3,3"/>
  <rect x="243.0" y="383.0" width="14" height="14" fill="#FCFAF6" stroke="#7C6D5C" stroke-width="1.1"/>
  <text x="250" y="424" text-anchor="middle" font-size="5.2" letter-spacing="0" fill="#BFB4A4" font-weight="400">寸木在其本</text>
  <text x="300" y="200" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">金重于羽，岂谓一钩金与一舆羽</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">取食之重者，与礼之轻者而比之，奚翅食重？</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 告子下</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图一百六十二 · 寸木岑楼 · ch162a</text>
