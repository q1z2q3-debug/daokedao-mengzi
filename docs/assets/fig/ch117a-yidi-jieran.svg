  <text x="432" y="388" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#994433" font-weight="400">寇至则守</text>
  <text x="380" y="424" text-anchor="middle" font-size="6.2" letter-spacing="0" fill="#BFB4A4" font-weight="400">或远害，或死难：所处之地不同，其心一也</text>
