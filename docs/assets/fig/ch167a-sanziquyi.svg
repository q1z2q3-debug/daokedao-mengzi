<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">三 子 趋 一</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》告子下　第一百六十七章　MZ167</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="6.2" letter-spacing="1" fill="#BFB4A4" font-weight="400">三子者不同道，其趋一也；一者何也？曰：仁也</text>
  <line x1="120" y1="404" x2="660" y2="404" stroke="#8C7B69" stroke-width="1.2"/>
  <circle cx="470" cy="300" r="34" fill="none" stroke="#7C6D5C" stroke-width="1.3"/>
  <text x="470" y="305" text-anchor="middle" font-size="10" letter-spacing="2" fill="#25211D" font-weight="400">仁</text>
  <path d="M 180,396 Q 260,400 432,322" fill="none" stroke="#7C6D5C" stroke-width="1.1"/>
  <path d="M 180,300 Q 300,250 436,300" fill="none" stroke="#7C6D5C" stroke-width="1.1"/>
  <path d="M 180,240 Q 300,300 432,286" fill="none" stroke="#7C6D5C" stroke-width="1.1"/>
  <text x="170" y="400" text-anchor="middle" font-size="6.0" letter-spacing="1" fill="#7C6D5C" font-weight="400">伯夷</text>
  <text x="170" y="304" text-anchor="middle" font-size="6.0" letter-spacing="1" fill="#7C6D5C" font-weight="400">伊尹</text>
  <text x="170" y="236" text-anchor="middle" font-size="6.0" letter-spacing="1" fill="#7C6D5C" font-weight="400">柳下惠</text>
  <text x="540" y="268" text-anchor="middle" font-size="5.0" letter-spacing="0" fill="#BFB4A4" font-weight="400">居下位不以贤事不肖</text>
  <text x="540" y="292" text-anchor="middle" font-size="5.0" letter-spacing="0" fill="#BFB4A4" font-weight="400">五就汤五就桀</text>
  <text x="540" y="316" text-anchor="middle" font-size="5.0" letter-spacing="0" fill="#BFB4A4" font-weight="400">不恶污君不辞小官</text>
  <text x="380" y="404" text-anchor="middle" font-size="5.8" letter-spacing="0" fill="#994433" font-weight="400">君子亦仁而已矣，何必同？</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">君子亦仁而已矣，何必同？</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 告子下</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图七十八 · 三子趋一 · ch167a</text>
</svg>
