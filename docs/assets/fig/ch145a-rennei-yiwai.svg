<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">仁 内 义 外</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》告子上　第一百四十五章　MZ145</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="6.6" letter-spacing="1" fill="#BFB4A4" font-weight="400">仁，内也，非外也；义，外也，非内也</text>
  <circle cx="250" cy="300" r="76" fill="none" stroke="#DCD5C8" stroke-width="1.0"/>
  <circle cx="250" cy="300" r="70" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="250" y="292" text-anchor="middle" font-size="13" letter-spacing="4" fill="#25211D" font-weight="400">仁</text>
  <text x="250" y="314" text-anchor="middle" font-size="6.0" letter-spacing="2" fill="#BFB4A4" font-weight="400">内</text>
  <rect x="500" y="244" width="130" height="112" fill="none" stroke="#DCD5C8" stroke-width="1.0"/>
  <text x="565" y="288" text-anchor="middle" font-size="13" letter-spacing="4" fill="#25211D" font-weight="400">义</text>
  <text x="565" y="310" text-anchor="middle" font-size="6.0" letter-spacing="2" fill="#BFB4A4" font-weight="400">外</text>
  <line x1="120" y1="404" x2="660" y2="404" stroke="#8C7B69" stroke-width="1.2"/>
  <circle cx="380" cy="330" r="6" fill="none" stroke="#25211D" stroke-width="1.1"/>
  <line x1="380" y1="336" x2="380" y2="372" stroke="#25211D" stroke-width="1.2"/>
  <line x1="380" y1="372" x2="366" y2="404" stroke="#25211D" stroke-width="1.0"/>
  <line x1="380" y1="372" x2="394" y2="404" stroke="#25211D" stroke-width="1.0"/>
  <line x1="380" y1="346" x2="404" y2="336" stroke="#25211D" stroke-width="1.0"/>
  <line x1="330" y1="336" x2="368" y2="346" stroke="#25211D" stroke-width="1.0"/>
  <text x="380" y="260" text-anchor="middle" font-size="6.0" letter-spacing="0" fill="#994433" font-weight="400">彼长而我长之</text>
  <text x="380" y="424" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#BFB4A4" font-weight="400">长之者，我也——义不在彼</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">彼长而我长之，非有长于我也。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 告子上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图五十六 · 仁内义外 · ch145a</text>
</svg>
