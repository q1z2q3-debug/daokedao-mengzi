  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》尽心下　第二百三十二章　MZ232</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="5.8" letter-spacing="1" fill="#BFB4A4" font-weight="400">身不行道，不行于妻子；使人不以道，不能行于妻子</text>
  <line x1="120" y1="404" x2="660" y2="404" stroke="#8C7B69" stroke-width="1.2"/>
  <text x="380" y="158" text-anchor="middle" font-size="6.2" letter-spacing="2" fill="#25211D" font-weight="400">道 不 行 也，非 人 不 从</text>
