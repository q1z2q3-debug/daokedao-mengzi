  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 离娄下</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图一百一十六 · 责善贼恩 · ch116a</text>
