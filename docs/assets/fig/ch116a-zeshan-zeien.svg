  <text x="216" y="288" text-anchor="middle" font-size="5.8" letter-spacing="2" fill="#7C6D5C" font-weight="400">朋友</text>
  <text x="544" y="288" text-anchor="middle" font-size="5.8" letter-spacing="2" fill="#994433" font-weight="400">父子</text>
  <text x="216" y="356" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">可以责</text>
  <text x="544" y="356" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#994433" font-weight="400">不可以责</text>
  <text x="380" y="424" text-anchor="middle" font-size="6.2" letter-spacing="0" fill="#BFB4A4" font-weight="400">贼恩之大者；章子出妻屏子，终身不养</text>
