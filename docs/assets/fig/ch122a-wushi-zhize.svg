  <text x="520" y="424" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#BFB4A4" font-weight="400">予未得为孔子徒也</text>
  <text x="380" y="268" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#BFB4A4" font-weight="400">孔子卒至孟子游梁，方百四十余年</text>
