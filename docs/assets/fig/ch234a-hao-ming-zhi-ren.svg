  <text x="410" y="400" text-anchor="middle" font-size="5.0" letter-spacing="1" fill="#7C6D5C" font-weight="400">箪</text>
  <text x="500" y="366" text-anchor="middle" font-size="4.6" letter-spacing="0" fill="#994433" font-weight="400">碗沿一点，藏不住</text>
  <text x="230" y="430" text-anchor="middle" font-size="4.8" letter-spacing="0.5" fill="#8C7B69" font-weight="400">大处是他用力之处</text>
  <text x="540" y="430" text-anchor="middle" font-size="4.8" letter-spacing="0.5" fill="#8C7B69" font-weight="400">小处是他不经意之处</text>
