  <text x="408" y="306" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#994433" font-weight="400">赵孟能贱之</text>
  <text x="380" y="210" text-anchor="middle" font-size="6.0" letter-spacing="2" fill="#25211D" font-weight="400">既醉以酒，既饱以德</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">言饱乎仁义也，所以不愿人之膏粱之味也。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 告子上</text>
