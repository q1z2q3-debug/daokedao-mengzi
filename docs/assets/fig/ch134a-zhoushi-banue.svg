  <text x="210" y="240" text-anchor="start" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">受地：千里／百里／七十／五十</text>
  <text x="380" y="428" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">诸侯恶其害己，而皆去其籍</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">其详不可得闻也，尝闻其略也。</text>
