  <text x="380" y="214" text-anchor="middle" font-size="6.8" letter-spacing="3" fill="#25211D" font-weight="400">利 与 善 之 间</text>
  <text x="380" y="236" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#BFB4A4" font-weight="400">所 争 毫 末</text>
