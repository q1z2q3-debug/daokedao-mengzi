  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">舜 跖 之 分</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》尽心上　第二百〇二章　MZ202</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="5.8" letter-spacing="1" fill="#BFB4A4" font-weight="400">鸡鸣而起，孳孳为善者，舜之徒也；孳孳为利者，跖之徒也</text>
