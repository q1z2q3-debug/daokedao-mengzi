<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">仁 也 者 人 也</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》尽心下　第二百三十九章　MZ239</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="6.2" letter-spacing="2" fill="#7C6D5C" font-weight="400">仁也者，人也。合而言之，道也</text>
  <circle cx="380" cy="300" r="116" fill="none" stroke="#7C6D5C" stroke-width="1.2"/>
  <text x="380" y="178" text-anchor="middle" font-size="10.0" letter-spacing="2" fill="#7C6D5C" font-weight="400">道</text>
  <circle cx="380" cy="262" r="11" fill="none" stroke="#25211D" stroke-width="1.2"/>
  <line x1="380" y1="274" x2="380" y2="292" stroke="#25211D" stroke-width="1.2"/>
  <line x1="348" y1="300" x2="412" y2="300" stroke="#25211D" stroke-width="1.2"/>
  <line x1="348" y1="300" x2="332" y2="338" stroke="#25211D" stroke-width="1.0"/>
  <line x1="412" y1="300" x2="428" y2="338" stroke="#25211D" stroke-width="1.0"/>
  <line x1="362" y1="316" x2="352" y2="404" stroke="#25211D" stroke-width="1.2"/>
  <line x1="398" y1="316" x2="408" y2="404" stroke="#25211D" stroke-width="1.2"/>
  <line x1="380" y1="292" x2="380" y2="314" stroke="#25211D" stroke-width="0.9"/>
  <text x="380" y="344" text-anchor="middle" font-size="12.0" letter-spacing="2" fill="#994433" font-weight="400">仁</text>
  <text x="380" y="366" text-anchor="middle" font-size="4.4" letter-spacing="0" fill="#8C7B69" font-weight="400">人之所以为人之理</text>
  <text x="380" y="428" text-anchor="middle" font-size="5.8" letter-spacing="1.6" fill="#25211D" font-weight="400">理在物上，才成道</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">理不落物是空的，物不合理是野的。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 离娄上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图二百三十九 · 仁也者人也 · ch239a</text>
</svg>
