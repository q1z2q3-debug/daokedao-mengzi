  <text x="380" y="300" text-anchor="middle" font-size="6.4" letter-spacing="2" fill="#994433" font-weight="400">不　可　得　兼</text>
  <text x="380" y="380" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#BFB4A4" font-weight="400">取舍之间，见其所欲之深浅</text>
  <text x="380" y="424" text-anchor="middle" font-size="5.8" letter-spacing="0" fill="#25211D" font-weight="400">所欲有甚于生者</text>
