  <line x1="200" y1="383.84" x2="192.44" y2="404" stroke="#25211D" stroke-width="0.9"/>
  <line x1="200" y1="383.84" x2="207.56" y2="404" stroke="#25211D" stroke-width="0.9"/>
  <text x="200" y="424" text-anchor="middle" font-size="5.4" letter-spacing="1" fill="#BFB4A4" font-weight="400">为 我</text>
  <circle cx="566" cy="326.3" r="6.3" fill="none" stroke="#25211D" stroke-width="0.9"/>
  <line x1="566" y1="332.6" x2="566" y2="383.84" stroke="#25211D" stroke-width="1.125"/>
  <line x1="566" y1="342.68" x2="552.56" y2="359.48" stroke="#25211D" stroke-width="0.9"/>
  <line x1="566" y1="342.68" x2="608.0" y2="347.72" stroke="#25211D" stroke-width="0.9"/>
  <line x1="566" y1="383.84" x2="558.44" y2="404" stroke="#25211D" stroke-width="0.9"/>
  <line x1="566" y1="383.84" x2="573.56" y2="404" stroke="#25211D" stroke-width="0.9"/>
  <text x="566" y="424" text-anchor="middle" font-size="5.4" letter-spacing="1" fill="#BFB4A4" font-weight="400">兼 爱</text>
  <text x="200" y="224" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#BFB4A4" font-weight="400">拔 一 毛 而 不 为</text>
  <text x="566" y="224" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#BFB4A4" font-weight="400">摩 顶 放 踵</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">所恶执一者，为其贼道也，举一而废百也。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 尽心上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图一百一十四 · 执中无权 · ch203a</text>
