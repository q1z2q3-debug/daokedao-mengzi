  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">执 中 无 权</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》尽心上　第二百〇三章　MZ203</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="5.9" letter-spacing="1" fill="#BFB4A4" font-weight="400">杨子取为我，墨子兼爱，子莫执中；执中无权，犹执一也</text>
  <line x1="120" y1="404" x2="660" y2="404" stroke="#8C7B69" stroke-width="1.2"/>
  <line x1="206" y1="252" x2="554" y2="252" stroke="#8C7B69" stroke-width="1.3"/>
  <path d="M 367.0,278 L 380.0,254 L 393.0,278 Z" fill="#F0EBE2" stroke="#8C7B69" stroke-width="1.1700000000000002"/>
