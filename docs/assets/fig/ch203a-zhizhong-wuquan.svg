  <circle cx="380" cy="306" r="15" fill="#F0EBE2" stroke="#8C7B69" stroke-width="1.2"/>
  <text x="380" y="394" text-anchor="middle" font-size="5.8" letter-spacing="1" fill="#7C6D5C" font-weight="400">执 中</text>
  <text x="380" y="338" text-anchor="middle" font-size="5.2" letter-spacing="0" fill="#BFB4A4" font-weight="400">权</text>
  <text x="424" y="340" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#994433" font-weight="400">锤 不 动</text>
  <circle cx="200" cy="326.3" r="6.3" fill="none" stroke="#25211D" stroke-width="0.9"/>
  <line x1="200" y1="332.6" x2="200" y2="383.84" stroke="#25211D" stroke-width="1.125"/>
