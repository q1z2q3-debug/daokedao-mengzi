  <text x="380" y="146" text-anchor="middle" font-size="6.4" fill="#994433">经界：沟涂封植</text>
  <text x="602" y="216" text-anchor="middle" font-size="6.4" fill="#7C6D5C">方里而井</text>
  <text x="602" y="234" text-anchor="middle" font-size="6.4" fill="#7C6D5C">井九百亩</text>
  <text x="602" y="258" text-anchor="middle" font-size="5.8" fill="#BFB4A4">八家皆私百亩</text>
  <text x="602" y="274" text-anchor="middle" font-size="5.8" fill="#BFB4A4">同养公田</text>
  <text x="602" y="300" text-anchor="middle" font-size="5.8" fill="#994433">公事毕</text>
  <text x="602" y="316" text-anchor="middle" font-size="5.8" fill="#994433">然后敢治私事</text>
