  <text x="560" y="424" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#BFB4A4" font-weight="400">水无有不下</text>
  <text x="300" y="260" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">可使过颡，可使在山——势也，非性也</text>
