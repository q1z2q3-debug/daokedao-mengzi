  <text x="320" y="200" text-anchor="middle" font-size="8.4" letter-spacing="1" fill="#25211D" font-weight="400">志</text>
  <text x="320" y="160" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#BFB4A4" font-weight="400">高 尚 其 志</text>
  <text x="300" y="428" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#BFB4A4" font-weight="400">杀一无罪，非仁也</text>
  <text x="520" y="428" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#BFB4A4" font-weight="400">非其有而取之，非义也</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">居仁由义，大人之事备矣。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 尽心上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图二百一十 · 尚志 · ch210a</text>
