  <text x="286" y="428" text-anchor="middle" font-size="5.6" letter-spacing="1" fill="#7C6D5C" font-weight="400">饥 者 甘 食</text>
  <ellipse cx="490" cy="352" rx="34" ry="10" fill="#F0EBE2" stroke="#25211D" stroke-width="1.4"/>
  <path d="M 456,352 C 456,367.0 471.3,373.0 490,373.0 C 508.7,373.0 524,367.0 524,352" fill="#F0EBE2" stroke="#25211D" stroke-width="1.4"/>
