  <text x="404" y="288" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#BFB4A4" font-weight="400">正 味</text>
  <circle cx="618" cy="326" r="22" fill="none" stroke="#7C6D5C" stroke-width="1.2"/>
  <text x="618" y="331" text-anchor="middle" font-size="6.2" letter-spacing="0" fill="#25211D" font-weight="400">心</text>
  <text x="618" y="288" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#994433" font-weight="400">贫 贱 害 之</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">人能无以饥渴之害为心害，则不及人不为忧矣。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 尽心上</text>
