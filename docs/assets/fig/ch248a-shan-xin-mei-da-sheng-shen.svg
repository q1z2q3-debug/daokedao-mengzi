  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">善 信 美 大 圣 神</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》尽心下　第二百四十八章　MZ248</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="5.4" letter-spacing="0.8" fill="#7C6D5C" font-weight="400">可欲之谓善，有诸己之谓信，充实之谓美，充实而有光辉之谓大</text>
