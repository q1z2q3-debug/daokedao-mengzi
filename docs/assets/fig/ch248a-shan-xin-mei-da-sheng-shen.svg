  <text x="568" y="400" text-anchor="start" font-size="4.4" letter-spacing="0" fill="#8C7B69" font-weight="400">二之中·四之下</text>
  <line x1="196" y1="396" x2="196" y2="200" stroke="#994433" stroke-width="1.2"/>
  <path d="M 198.6,204.3 L 196,200 L 193.4,204.3" fill="none" stroke="#994433" stroke-width="1.08"/>
  <text x="182" y="300" text-anchor="end" font-size="5.4" letter-spacing="1" fill="#994433" font-weight="400">上</text>
  <text x="380" y="424" text-anchor="middle" font-size="6.2" letter-spacing="1.8" fill="#25211D" font-weight="400">一级比一级窄——越高越难占</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">善是别人愿意要，信是自己真有；满了才是美。</text>
