  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">人 皆 有 所 不 忍</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》尽心下　第二百五十四章　MZ254</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="5.6" letter-spacing="1.0" fill="#7C6D5C" font-weight="400">人皆有所不忍，达之于其所忍，仁也</text>
  <line x1="380" y1="130" x2="380" y2="306" stroke="#BFB4A4" stroke-width="0.9" stroke-dasharray="5,5"/>
  <circle cx="264" cy="196" r="44" fill="#F0EBE2" stroke="#7C6D5C" stroke-width="1.4"/>
  <text x="264" y="200" text-anchor="middle" font-size="6.6" letter-spacing="1.5" fill="#25211D" font-weight="400">不忍</text>
  <text x="264" y="152" text-anchor="middle" font-size="4.6" letter-spacing="0.5" fill="#8C7B69" font-weight="400">人人本有</text>
  <circle cx="500" cy="196" r="78" fill="#FCFAF6" stroke="#994433" stroke-width="1.4"/>
  <text x="500" y="190" text-anchor="middle" font-size="5.6" letter-spacing="1" fill="#7C6D5C" font-weight="400">不忍</text>
  <text x="500" y="206" text-anchor="middle" font-size="5.6" letter-spacing="1" fill="#7C6D5C" font-weight="400">所忍</text>
  <text x="500" y="132" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#994433" font-weight="400">达 · 推而广之</text>
