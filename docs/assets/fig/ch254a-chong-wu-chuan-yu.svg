  <text x="500" y="418" text-anchor="middle" font-size="4.8" letter-spacing="0.6" fill="#7C6D5C" font-weight="400">穿逾之类，亦是探</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">仁只是一个推字；推不到处，正是所忍处。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 尽心下</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图一百六十五 · 人皆有所不忍 · ch254a</text>
