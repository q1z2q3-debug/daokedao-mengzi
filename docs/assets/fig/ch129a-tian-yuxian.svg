<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">天 与 贤</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》万章上　第一百二十九章　MZ129</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="6.6" letter-spacing="1" fill="#BFB4A4" font-weight="400">天与贤，则与贤；天与子，则与子</text>
  <line x1="96" y1="404" x2="664" y2="404" stroke="#8C7B69" stroke-width="1.3"/>
  <line x1="200" y1="276" x2="560" y2="276" stroke="#7C6D5C" stroke-width="1.4"/>
  <line x1="380" y1="276" x2="380" y2="258" stroke="#7C6D5C" stroke-width="1.2"/>
  <circle cx="380" cy="252" r="6" fill="none" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="214" y1="276" x2="214" y2="316" stroke="#BFB4A4" stroke-width="0.9"/>
  <line x1="546" y1="276" x2="546" y2="316" stroke="#BFB4A4" stroke-width="0.9"/>
  <ellipse cx="214" cy="322" rx="34" ry="7" fill="#F0EBE2" stroke="#7C6D5C" stroke-width="1.1"/>
  <ellipse cx="546" cy="322" rx="34" ry="7" fill="#F0EBE2" stroke="#7C6D5C" stroke-width="1.1"/>
  <text x="214" y="240" text-anchor="middle" font-size="7.0" letter-spacing="2" fill="#25211D" font-weight="400">贤</text>
  <text x="546" y="240" text-anchor="middle" font-size="7.0" letter-spacing="2" fill="#25211D" font-weight="400">子</text>
  <text x="214" y="348" text-anchor="middle" font-size="5.2" letter-spacing="0" fill="#BFB4A4" font-weight="400">舜禹益</text>
  <text x="546" y="348" text-anchor="middle" font-size="5.2" letter-spacing="0" fill="#BFB4A4" font-weight="400">启太甲成王</text>
  <text x="380" y="424" text-anchor="middle" font-size="5.8" letter-spacing="0" fill="#BFB4A4" font-weight="400">莫之为而为者，天也；莫之致而至者，命也</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">其义一也。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 万章上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图四十 · 天与贤 · ch129a</text>
</svg>
