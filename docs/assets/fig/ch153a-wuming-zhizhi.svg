  <line x1="548" y1="276" x2="644" y2="276" stroke="#8C7B69" stroke-width="1.4"/>
  <text x="596" y="268" text-anchor="middle" font-size="5.8" letter-spacing="2" fill="#7C6D5C" font-weight="400">秦 楚</text>
  <text x="420" y="306" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">不远千里</text>
