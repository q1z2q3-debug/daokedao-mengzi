  <path d="M 278,276 q 14,13 0,26" fill="none" stroke="#7C6D5C" stroke-width="1.2"/>
  <ellipse cx="286" cy="289" rx="5" ry="7" fill="#F0EBE2" stroke="#7C6D5C" stroke-width="0.8"/>
