  <text x="560" y="205" text-anchor="middle" font-size="12" letter-spacing="2" fill="#25211D" font-weight="400">心</text>
  <text x="560" y="240" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">则不知恶</text>
  <text x="380" y="172" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#994433" font-weight="400">指不若人，则知恶之</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">心不若人，则不知恶，此之谓不知类也。</text>
