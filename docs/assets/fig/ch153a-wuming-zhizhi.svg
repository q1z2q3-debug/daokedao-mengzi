  <text x="250" y="348" text-anchor="middle" font-size="5.6" letter-spacing="1" fill="#994433" font-weight="400">屈 而 不 信</text>
  <text x="228" y="424" text-anchor="middle" font-size="5.8" letter-spacing="1" fill="#7C6D5C" font-weight="400">无名之指</text>
