  <line x1="380" y1="330" x2="360" y2="356" stroke="#994433" stroke-width="1.2"/>
  <text x="470" y="366" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#994433" font-weight="400">血 流 漂 杵</text>
