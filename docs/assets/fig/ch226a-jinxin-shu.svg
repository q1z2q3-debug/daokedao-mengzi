  <text x="552" y="396" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#7C6D5C" font-weight="400">二 三 策</text>
  <text x="552" y="412" text-anchor="middle" font-size="4.6" letter-spacing="1" fill="#BFB4A4" font-weight="400">奉 天 伐 暴</text>
  <text x="380" y="240" text-anchor="middle" font-size="5.6" letter-spacing="2" fill="#25211D" font-weight="400">仁 人 无 敌 于 天 下</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">以至仁伐至不仁，而何其血之流杵也？</text>
