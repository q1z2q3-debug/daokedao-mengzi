  <line x1="120" y1="404" x2="660" y2="404" stroke="#8C7B69" stroke-width="1.3"/>
  <text x="380" y="428" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">悦贤不能举，又不能养，可谓悦贤乎</text>
