<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">日 食</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C">《孟子》公孙丑下　第四十一章　MZ041</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <circle cx="290" cy="262" r="72" fill="none" stroke="#994433" stroke-width="1.4"/>
  <circle cx="290" cy="262" r="72" fill="#F0EBE2" opacity="0.0"/>
  <path d="M 290,190 A 72,72 0 0 1 290,334 A 60,72 0 0 0 290,190" fill="#25211D" opacity="0.55"/>
  <path d="M 350,236 C 386,232 400,262 392,290" fill="none" stroke="#994433" stroke-width="1"/>
  <polygon points="396,302 386,288 398,286" fill="#994433"/>
  <text x="290" y="356" text-anchor="middle" font-size="6.8" fill="#8C7B69">其过也，如日月之食</text>
  <text x="290" y="374" text-anchor="middle" font-size="6.4" fill="#7C6D5C">民皆见之</text>
  <text x="420" y="322" font-size="6.4" fill="#994433">及其更也</text>

  <rect x="520" y="200" width="130" height="150" fill="#FCFAF6" stroke="#8C7B69" stroke-width="1"/>
  <line x1="534" y1="222" x2="636" y2="222" stroke="#DCD5C8" stroke-width="0.8"/>
  <line x1="534" y1="244" x2="636" y2="244" stroke="#DCD5C8" stroke-width="0.8"/>
  <line x1="534" y1="266" x2="636" y2="266" stroke="#DCD5C8" stroke-width="0.8"/>
  <line x1="534" y1="288" x2="636" y2="288" stroke="#DCD5C8" stroke-width="0.8"/>
  <line x1="534" y1="310" x2="636" y2="310" stroke="#DCD5C8" stroke-width="0.8"/>
  <line x1="534" y1="332" x2="636" y2="332" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="585" y="188" text-anchor="middle" font-size="6.8" fill="#8C7B69">为之辞</text>
  <text x="585" y="372" text-anchor="middle" font-size="6.4" fill="#7C6D5C">替它写一套说法</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D">错是食，改是复圆；给它写说法，是永远不圆。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 公孙丑下</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图四十一 · 日食 · ch41a</text>
</svg>
