<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">尧 舜 性 者 也</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》尽心下　第二百五十六章　MZ256</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="5.8" letter-spacing="1.2" fill="#7C6D5C" font-weight="400">性之与反之，及其成功则一也</text>
  <text x="330" y="130" text-anchor="middle" font-size="9.4" letter-spacing="3" fill="#25211D" font-weight="400">天</text>
  <line x1="330" y1="146" x2="330" y2="348" stroke="#7C6D5C" stroke-width="1.9"/>
  <line x1="352" y1="152" x2="502" y2="300" stroke="#7C6D5C" stroke-width="1.5"/>
  <line x1="502" y1="300" x2="452" y2="336" stroke="#7C6D5C" stroke-width="1.5"/>
  <line x1="452" y1="336" x2="348" y2="362" stroke="#7C6D5C" stroke-width="1.5"/>
  <text x="316" y="250" text-anchor="end" font-size="5.2" letter-spacing="0.8" fill="#8C7B69" font-weight="400">性者·尧舜</text>
  <text x="300" y="190" text-anchor="end" font-size="4.6" letter-spacing="1.0" fill="#7C6D5C" font-weight="400">得全于天</text>
  <text x="518" y="268" text-anchor="start" font-size="5.2" letter-spacing="0.8" fill="#8C7B69" font-weight="400">反之·汤武</text>
  <text x="510" y="316" text-anchor="start" font-size="5.0" letter-spacing="1" fill="#994433" font-weight="400">折</text>
  <text x="518" y="232" text-anchor="start" font-size="4.6" letter-spacing="0.4" fill="#7C6D5C" font-weight="400">修为以复其性</text>
  <circle cx="330" cy="368" r="19" fill="#F0EBE2" stroke="#994433" stroke-width="1.3"/>
  <text x="330" y="373" text-anchor="middle" font-size="9.4" letter-spacing="1" fill="#994433" font-weight="400">圣</text>
  <text x="380" y="420" text-anchor="middle" font-size="5.8" letter-spacing="0.9" fill="#25211D" font-weight="400">性者无意而安行，反者有意利行而至于无意</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">两路不同，到头是一个圣。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 尽心下</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图二百五十六 · 尧舜性者也 · ch256a</text>
</svg>
