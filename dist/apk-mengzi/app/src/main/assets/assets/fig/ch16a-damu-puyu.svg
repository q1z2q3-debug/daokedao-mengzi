<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="6" fill="#25211D" font-weight="700">大 木 与 璞 玉</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C">《孟子》梁惠王下　第十六章　MZ016</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="150" y="112" text-anchor="middle" font-size="7.4" fill="#7C6D5C">一　工师得大木</text>
  <text x="380" y="112" text-anchor="middle" font-size="7.4" fill="#7C6D5C">二　匠人斲而小之</text>
  <text x="610" y="112" text-anchor="middle" font-size="7.4" fill="#7C6D5C">三　璞玉付玉人</text>

  <rect x="52" y="140" width="196" height="120" fill="#FCFAF6" stroke="#DCD5C8" stroke-width="1"/>
  <polygon points="76,208 216,196 218,208 78,220" fill="#FCFAF6" stroke="#994433" stroke-width="1.3"/>
  <text x="150" y="184" text-anchor="middle" font-size="7" fill="#7C6D5C">大木</text>
  <text x="150" y="248" text-anchor="middle" font-size="7.4" fill="#994433">王喜</text>

  <rect x="282" y="140" width="196" height="120" fill="#FCFAF6" stroke="#DCD5C8" stroke-width="1"/>
  <polygon points="330,210 430,204 432,212 332,218" fill="#FCFAF6" stroke="#8C7B69" stroke-width="1.3"/>
  <line x1="356" y1="196" x2="356" y2="214" stroke="#8C7B69" stroke-width="0.8"/>
  <text x="380" y="184" text-anchor="middle" font-size="7" fill="#7C6D5C">砍小了</text>
  <text x="380" y="248" text-anchor="middle" font-size="7.4" fill="#8C7B69">王怒</text>

  <rect x="512" y="140" width="196" height="120" fill="#FCFAF6" stroke="#DCD5C8" stroke-width="1"/>
  <polygon points="576,222 572,200 586,188 606,192 614,210 602,224" fill="#F0EBE2" stroke="#7C6D5C" stroke-width="1.2"/>
  <ellipse cx="594" cy="206" rx="10" ry="7" fill="#FCFAF6" stroke="#994433" stroke-width="1.1"/>
  <path d="M 600,198 L 614,188" stroke="#994433" stroke-width="1"/>
  <path d="M 590,196 L 576,190" stroke="#7C6D5C" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="610" y="184" text-anchor="middle" font-size="7" fill="#7C6D5C">璞玉</text>
  <text x="610" y="248" text-anchor="middle" font-size="7.4" fill="#994433">付玉人</text>

  <line x1="70" y1="282" x2="690" y2="282" stroke="#DCD5C8" stroke-width="0.8"/>

  <rect x="76" y="308" width="120" height="76" fill="#FCFAF6" stroke="#25211D" stroke-width="1.2"/>
  <line x1="76" y1="334" x2="196" y2="334" stroke="#DCD5C8" stroke-width="0.8"/>
  <line x1="76" y1="358" x2="196" y2="358" stroke="#DCD5C8" stroke-width="0.8"/>
  <text x="136" y="348" text-anchor="middle" font-size="12" letter-spacing="4" fill="#25211D">国</text>
  <text x="136" y="378" text-anchor="middle" font-size="6.6" fill="#8C7B69">地、民、政</text>
  <text x="136" y="398" text-anchor="middle" font-size="7" fill="#7C6D5C">治国家</text>

  <path d="M 232,342 C 280,330 320,334 356,342" fill="none" stroke="#994433" stroke-width="1.2"/>
  <polygon points="368,344 354,337 354,351" fill="#994433"/>
  <text x="300" y="324" text-anchor="middle" font-size="7.6" fill="#994433">姑舍女所学而从我</text>

  <g transform="rotate(-8 500 344)">
    <rect x="440" y="316" width="150" height="46" fill="#F7F4EE" stroke="#994433" stroke-width="1.1"/>
    <text x="515" y="345" text-anchor="middle" font-size="8" letter-spacing="1" fill="#994433">教玉人雕琢玉</text>
  </g>
  <text x="560" y="398" text-anchor="middle" font-size="7" fill="#8C7B69">同一只手</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D">玉交得出去，国交不出去——不是不信人，是没把国看得比玉重。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 梁惠王下</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图十六 · 大木与璞玉 · ch16a</text>
</svg>
