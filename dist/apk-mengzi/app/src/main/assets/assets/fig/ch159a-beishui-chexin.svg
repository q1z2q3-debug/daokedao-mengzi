  <path d="M 214,346 q 40,-30 90,10" fill="none" stroke="#994433" stroke-width="1.0"/>
  <text x="300" y="320" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#994433" font-weight="400">不 熄</text>
  <text x="380" y="210" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#BFB4A4" font-weight="400">犹以一杯水救一车薪之火也</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">此又与于不仁之甚者也，亦终必亡而已矣。</text>
