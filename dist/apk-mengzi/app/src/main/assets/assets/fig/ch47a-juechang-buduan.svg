<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">绝 长 补 短</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C">《孟子》滕文公上　第四十七章　MZ047</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="100" y="250" width="180" height="34" fill="#F0EBE2" stroke="#8C7B69" stroke-width="1.3"/>
  <text x="190" y="308" text-anchor="middle" font-size="6.6" fill="#7C6D5C">滕　长而窄</text>
  <line x1="160" y1="240" x2="160" y2="296" stroke="#BFB4A4" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="220" y1="240" x2="220" y2="296" stroke="#BFB4A4" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="190" y="232" text-anchor="middle" font-size="6" fill="#BFB4A4">截为三段</text>
  <path d="M 306,267 L 356,267" stroke="#994433" stroke-width="1.2" stroke-dasharray="6 4"/>
  <polygon points="368,267 350,260 350,274" fill="#994433"/>
  <text x="336" y="290" text-anchor="middle" font-size="6" fill="#994433">绝</text>
  <rect x="440" y="234" width="100" height="66" fill="#FCFAF6" stroke="#994433" stroke-width="1.4"/>
  <line x1="473" y1="234" x2="473" y2="300" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="506" y1="234" x2="506" y2="300" stroke="#DCD5C8" stroke-width="0.9"/>
  <text x="490" y="272" text-anchor="middle" font-size="6.8" fill="#994433">方</text>
  <text x="490" y="318" text-anchor="middle" font-size="6.4" fill="#7C6D5C">将五十里　犹可以为善国</text>
  <text x="490" y="200" text-anchor="middle" font-size="6.4" fill="#8C7B69">面积不变，形状变了</text>
  <text x="380" y="382" text-anchor="middle" font-size="7.4" fill="#994433">《书》曰：若药不瞑眩，厥疾不瘳</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D">不能长，就把长的截下来补短的。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 滕文公上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图四十七 · 绝长补短 · ch47a</text>
</svg>
