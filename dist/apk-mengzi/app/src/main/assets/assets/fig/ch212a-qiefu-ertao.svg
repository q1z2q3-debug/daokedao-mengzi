  <text x="626" y="424" text-anchor="middle" font-size="5.0" letter-spacing="1" fill="#BFB4A4" font-weight="400">遵 海 滨 而 处</text>
  <text x="486" y="424" text-anchor="middle" font-size="5.4" letter-spacing="1" fill="#7C6D5C" font-weight="400">窃 负 而 逃</text>
  <text x="380" y="190" text-anchor="middle" font-size="6.4" letter-spacing="2" fill="#25211D" font-weight="400">知 有 父，不 知 有 天 下</text>
