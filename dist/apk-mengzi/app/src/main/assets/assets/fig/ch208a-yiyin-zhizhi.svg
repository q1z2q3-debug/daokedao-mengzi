  <text x="562" y="398" text-anchor="middle" font-size="7.6" letter-spacing="1" fill="#994433" font-weight="400">篡</text>
  <text x="600" y="314" text-anchor="middle" font-size="4.7" letter-spacing="1" fill="#BFB4A4" font-weight="400">有 志</text>
  <text x="604" y="412" text-anchor="middle" font-size="4.7" letter-spacing="1" fill="#994433" font-weight="400">无 志</text>
  <text x="466" y="290" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#7C6D5C" font-weight="400">一 印</text>
  <text x="380" y="180" text-anchor="middle" font-size="6.6" letter-spacing="2" fill="#25211D" font-weight="400">一 印 在 手，两 解 在 心</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">有伊尹之志，则可；无伊尹之志，则篡也。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 尽心上</text>
