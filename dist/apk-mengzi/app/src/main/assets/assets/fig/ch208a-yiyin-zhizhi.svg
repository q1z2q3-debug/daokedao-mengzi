  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》尽心上　第二百〇八章　MZ208</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="5.7" letter-spacing="1" fill="#BFB4A4" font-weight="400">伊尹放太甲于桐，民大悦；太甲贤，又反之，民大悦</text>
