<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">求 在 我</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》尽心上　第一百八十章　MZ180</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="6.0" letter-spacing="1" fill="#BFB4A4" font-weight="400">求则得之，舍则失之，是求有益于得也，求在我者也</text>
  <line x1="120" y1="404" x2="660" y2="404" stroke="#8C7B69" stroke-width="1.2"/>
  <circle cx="300" cy="300" r="92" fill="none" stroke="#7C6D5C" stroke-width="1.3"/>
  <text x="268" y="268" text-anchor="middle" font-size="8.6" letter-spacing="1" fill="#25211D" font-weight="400">仁</text>
  <text x="332" y="268" text-anchor="middle" font-size="8.6" letter-spacing="1" fill="#25211D" font-weight="400">义</text>
  <text x="268" y="324" text-anchor="middle" font-size="8.6" letter-spacing="1" fill="#25211D" font-weight="400">礼</text>
  <text x="332" y="324" text-anchor="middle" font-size="8.6" letter-spacing="1" fill="#25211D" font-weight="400">智</text>
  <text x="300" y="424" text-anchor="middle" font-size="5.8" letter-spacing="2" fill="#7C6D5C" font-weight="400">在 我 者</text>
  <line x1="180" y1="300" x2="246" y2="300" stroke="#7C6D5C" stroke-width="0.9"/>
  <path d="M 242.6,302.1 L 246,300 L 242.6,297.9" fill="none" stroke="#7C6D5C" stroke-width="0.81"/>
  <text x="212" y="288" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#7C6D5C" font-weight="400">求</text>
  <rect x="516" y="258" width="34" height="26" fill="#F0EBE2" stroke="#8C7B69" stroke-width="1.1"/>
  <line x1="516" y1="258" x2="550" y2="258" stroke="#8C7B69" stroke-width="1.2"/>
  <text x="533" y="246" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">冠</text>
  <rect x="516" y="320" width="46" height="22" fill="#FCFAF6" stroke="#8C7B69" stroke-width="1.1"/>
  <text x="539" y="336" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">币</text>
  <path d="M 440,300 L 500,300" fill="none" stroke="#BFB4A4" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="470" y="288" text-anchor="middle" font-size="5.0" letter-spacing="0" fill="#BFB4A4" font-weight="400">求在外者</text>
  <text x="560" y="296" text-anchor="middle" font-size="5.2" letter-spacing="0" fill="#BFB4A4" font-weight="400">得之有命</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">求之有道，得之有命。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 尽心上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图一百八十 · 求在我 · ch180a</text>
</svg>
