  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">国 空 虚</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》尽心下　第二百三十五章　MZ235</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="6.0" letter-spacing="1.4" fill="#7C6D5C" font-weight="400">不信仁贤，则国空虚；无礼义，则上下乱；无政事，则财用不足</text>
  <rect x="170" y="168" width="420" height="226" fill="#FCFAF6" stroke="#25211D" stroke-width="1.3"/>
  <line x1="170" y1="168" x2="590" y2="168" stroke="#25211D" stroke-width="1.3"/>
  <line x1="310" y1="168" x2="310" y2="394" stroke="#BFB4A4" stroke-width="0.9"/>
  <line x1="450" y1="168" x2="450" y2="394" stroke="#BFB4A4" stroke-width="0.9"/>
  <text x="240" y="190" text-anchor="middle" font-size="5.4" letter-spacing="1" fill="#7C6D5C" font-weight="400">信仁贤</text>
  <text x="380" y="190" text-anchor="middle" font-size="5.4" letter-spacing="1" fill="#7C6D5C" font-weight="400">礼义</text>
  <text x="520" y="190" text-anchor="middle" font-size="5.4" letter-spacing="1" fill="#7C6D5C" font-weight="400">政事</text>
  <line x1="196" y1="352" x2="284" y2="352" stroke="#BFB4A4" stroke-width="1.0"/>
  <ellipse cx="232" cy="380" rx="4.6" ry="2.53" fill="#8C7B69" stroke="#8C7B69" stroke-width="0.7"/>
  <ellipse cx="252" cy="380" rx="4.6" ry="2.53" fill="#8C7B69" stroke="#8C7B69" stroke-width="0.7"/>
  <text x="240" y="330" text-anchor="middle" font-size="5.0" letter-spacing="1" fill="#8C7B69" font-weight="400">若无人然</text>
  <circle cx="380" cy="246" r="4.0" fill="none" stroke="#7C6D5C" stroke-width="0.9"/>
  <line x1="380" y1="242" x2="380" y2="206" stroke="#7C6D5C" stroke-width="1.0"/>
  <line x1="380" y1="206" x2="372" y2="196" stroke="#7C6D5C" stroke-width="0.9"/>
  <line x1="380" y1="206" x2="388" y2="196" stroke="#7C6D5C" stroke-width="0.9"/>
  <circle cx="380" cy="319" r="5" fill="none" stroke="#25211D" stroke-width="1.0"/>
  <line x1="380" y1="324" x2="380" y2="362.64" stroke="#25211D" stroke-width="1.25"/>
