  <line x1="380" y1="362.64" x2="385.76" y2="378" stroke="#25211D" stroke-width="1.0"/>
  <text x="332" y="236" text-anchor="middle" font-size="4.6" letter-spacing="0.5" fill="#8C7B69" font-weight="400">上下倒</text>
  <ellipse cx="520" cy="348" rx="24" ry="8" fill="#F0EBE2" stroke="#25211D" stroke-width="1.4"/>
  <path d="M 496,348 C 496,360.0 506.8,364.8 520,364.8 C 533.2,364.8 544,360.0 544,348" fill="#F0EBE2" stroke="#25211D" stroke-width="1.4"/>
  <path d="M 512.8,364.8 L 514.24,368.8 L 525.76,368.8 L 527.2,364.8" fill="none" stroke="#25211D" stroke-width="1.26"/>
  <circle cx="534" cy="340" r="2.0" fill="#994433" stroke="#994433" stroke-width="0.8"/>
  <text x="520" y="372" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#8C7B69" font-weight="400">财用不足</text>
  <text x="380" y="418" text-anchor="middle" font-size="6.2" letter-spacing="1.6" fill="#25211D" font-weight="400">三症一因：三者以仁贤为本</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">人、序、财三症，根只有一个：信不信仁贤。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 离娄上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图二百三十五 · 国空虚 · ch235a</text>
