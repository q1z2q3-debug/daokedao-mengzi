  <text x="616" y="128" text-anchor="middle" font-size="6.0" letter-spacing="2" fill="#994433" font-weight="400">多</text>
  <text x="210" y="400" text-anchor="middle" font-size="5.0" letter-spacing="0.8" fill="#7C6D5C" font-weight="400">寡欲 · 存者多</text>
  <text x="556" y="400" text-anchor="middle" font-size="5.0" letter-spacing="0.8" fill="#994433" font-weight="400">多欲 · 存者少</text>
  <text x="380" y="306" text-anchor="middle" font-size="4.6" letter-spacing="0.4" fill="#8C7B69" font-weight="400">缺口不在外，在被挤出来的那一处</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">寡，非无也；节而已。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 尽心下</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图二百五十八 · 养心莫善于寡欲 · ch258a</text>
