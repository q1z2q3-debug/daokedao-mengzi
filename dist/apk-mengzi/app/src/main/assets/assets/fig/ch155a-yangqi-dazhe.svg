  <text x="360" y="268" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#7C6D5C" font-weight="400">场 师</text>
  <text x="530" y="300" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">舍其梧槚，养其樲棘</text>
  <text x="530" y="330" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">则为贱场师焉</text>
  <text x="380" y="200" text-anchor="middle" font-size="5.8" letter-spacing="0" fill="#994433" font-weight="400">养其小者为小人，养其大者为大人</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">饮食之人，则人贱之矣，为其养小以失大也。</text>
