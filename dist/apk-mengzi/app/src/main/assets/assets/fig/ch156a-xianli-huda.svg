  <text x="292" y="326" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#994433" font-weight="400">大 体</text>
  <text x="240" y="424" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#7C6D5C" font-weight="400">从其大体</text>
  <line x1="430" y1="210" x2="430" y2="404" stroke="#DCD5C8" stroke-width="0.8"/>
  <circle cx="530" cy="294.85" r="8.85" fill="none" stroke="#25211D" stroke-width="1.2"/>
