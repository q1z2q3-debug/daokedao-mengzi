  <line x1="530" y1="317.86" x2="511.12" y2="343.82" stroke="#25211D" stroke-width="1.2"/>
  <line x1="530" y1="317.86" x2="548.88" y2="343.82" stroke="#25211D" stroke-width="1.2"/>
