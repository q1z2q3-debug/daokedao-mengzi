  <line x1="240" y1="317.86" x2="221.12" y2="343.82" stroke="#25211D" stroke-width="1.2"/>
  <line x1="240" y1="317.86" x2="258.88" y2="343.82" stroke="#25211D" stroke-width="1.2"/>
  <line x1="240" y1="375.68" x2="229.38" y2="404" stroke="#25211D" stroke-width="1.2"/>
  <line x1="240" y1="375.68" x2="250.62" y2="404" stroke="#25211D" stroke-width="1.2"/>
