  <ellipse cx="518" cy="358" rx="6" ry="3.4" fill="none" stroke="#BFB4A4" stroke-width="0.8"/>
  <ellipse cx="558" cy="358" rx="6" ry="3.4" fill="none" stroke="#BFB4A4" stroke-width="0.8"/>
  <text x="586" y="344" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">小 体</text>
  <text x="530" y="424" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#7C6D5C" font-weight="400">从其小体</text>
  <text x="240" y="214" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#994433" font-weight="400">心之官则思</text>
  <text x="530" y="214" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#BFB4A4" font-weight="400">耳目之官不思</text>
  <text x="380" y="268" text-anchor="middle" font-size="6.4" letter-spacing="3" fill="#25211D" font-weight="400">钧 是 人 也</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">先立乎其大者，则其小者不能夺也。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 告子上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图一百五十六 · 先立乎大 · ch156a</text>
