  <line x1="536" y1="396" x2="536" y2="404" stroke="#7C6D5C" stroke-width="0.8"/>
  <rect x="302" y="391" width="140" height="9" fill="#F0EBE2" stroke="#BFB4A4" stroke-width="0.6"/>
  <line x1="302" y1="391" x2="442" y2="391" stroke="#BFB4A4" stroke-width="0.6"/>
  <line x1="302" y1="400" x2="442" y2="400" stroke="#BFB4A4" stroke-width="0.6"/>
  <text x="300" y="288" text-anchor="middle" font-size="6.0" letter-spacing="2" fill="#7C6D5C" font-weight="400">表</text>
  <text x="464" y="388" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">影</text>
  <text x="300" y="372" text-anchor="middle" font-size="5.8" letter-spacing="1" fill="#994433" font-weight="400">求其故</text>
  <text x="380" y="424" text-anchor="middle" font-size="6.2" letter-spacing="0" fill="#BFB4A4" font-weight="400">千岁之日至，可坐而致；所恶于智者，为其凿也</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">苟求其故，千岁之日至，可坐而致也。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 离娄下</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图一百一十二 · 则故而已 · ch112a</text>
