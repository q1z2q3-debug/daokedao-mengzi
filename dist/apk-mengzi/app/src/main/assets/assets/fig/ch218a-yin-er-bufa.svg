  <text x="186" y="284" text-anchor="middle" font-size="6.6" letter-spacing="1" fill="#7C6D5C" font-weight="400">引</text>
  <text x="346" y="284" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#BFB4A4" font-weight="400">不 发</text>
  <text x="300" y="424" text-anchor="middle" font-size="5.2" letter-spacing="1" fill="#BFB4A4" font-weight="400">彀 率</text>
  <path d="M 470,200 L 470,404" fill="none" stroke="#DCD5C8" stroke-width="1.0" stroke-dasharray="4,4"/>
  <circle cx="470" cy="293.0" r="9.0" fill="none" stroke="#25211D" stroke-width="1.2"/>
  <line x1="470" y1="302.0" x2="470" y2="375.2" stroke="#25211D" stroke-width="1.5"/>
  <line x1="470" y1="316.4" x2="450.8" y2="342.79999999999995" stroke="#25211D" stroke-width="1.2"/>
  <line x1="470" y1="316.4" x2="489.2" y2="342.79999999999995" stroke="#25211D" stroke-width="1.2"/>
  <line x1="470" y1="375.2" x2="459.2" y2="404" stroke="#25211D" stroke-width="1.2"/>
