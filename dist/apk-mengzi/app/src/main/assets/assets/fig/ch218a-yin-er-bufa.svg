  <text x="470" y="424" text-anchor="middle" font-size="5.2" letter-spacing="1" fill="#7C6D5C" font-weight="400">中 道 而 立</text>
  <text x="440" y="188" text-anchor="middle" font-size="4.6" letter-spacing="1" fill="#BFB4A4" font-weight="400">非 难 非 易</text>
  <line x1="576" y1="404" x2="576" y2="356" stroke="#8C7B69" stroke-width="1.2"/>
  <line x1="680" y1="404" x2="680" y2="356" stroke="#8C7B69" stroke-width="1.2"/>
  <line x1="576" y1="356" x2="680" y2="356" stroke="#25211D" stroke-width="1.6"/>
  <text x="628" y="424" text-anchor="middle" font-size="5.2" letter-spacing="1" fill="#BFB4A4" font-weight="400">绳 墨</text>
  <text x="628" y="340" text-anchor="middle" font-size="4.7" letter-spacing="1" fill="#7C6D5C" font-weight="400">大 匠 不 改</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">大匠不为拙工改废绳墨，羿不为拙射变其彀率。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 尽心上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图二百一十八 · 引而不发 · ch218a</text>
</svg>
