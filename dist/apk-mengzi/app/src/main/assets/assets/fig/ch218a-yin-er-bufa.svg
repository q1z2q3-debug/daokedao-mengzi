  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">引 而 不 发</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》尽心上　第二百一十八章　MZ218</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="5.8" letter-spacing="1" fill="#BFB4A4" font-weight="400">道则高矣，美矣，宜若登天然，似不可及也</text>
  <line x1="120" y1="404" x2="660" y2="404" stroke="#8C7B69" stroke-width="1.2"/>
  <text x="380" y="166" text-anchor="middle" font-size="6.6" letter-spacing="2" fill="#25211D" font-weight="400">引 而 不 发，跃 如 也</text>
  <path d="M 270,214 Q 350,300 270,386" fill="none" stroke="#25211D" stroke-width="1.6"/>
  <path d="M 270,214 L 196,300 L 270,386" fill="none" stroke="#25211D" stroke-width="1.0"/>
  <line x1="270" y1="214" x2="256" y2="204" stroke="#25211D" stroke-width="1.4"/>
  <line x1="270" y1="386" x2="256" y2="396" stroke="#25211D" stroke-width="1.4"/>
