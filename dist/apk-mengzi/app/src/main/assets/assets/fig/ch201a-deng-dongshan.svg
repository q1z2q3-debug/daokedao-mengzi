  <text x="388" y="424" text-anchor="middle" font-size="5.4" letter-spacing="1" fill="#7C6D5C" font-weight="400">太 山 · 小 天下</text>
  <path d="M 496,262 C 532,252 546,300 580,300 C 612,300 620,332 648,336" fill="none" stroke="#7C6D5C" stroke-width="1.3"/>
  <path d="M 496,288 C 528,278 542,318 574,318 C 604,318 612,348 640,352" fill="none" stroke="#7C6D5C" stroke-width="1.0"/>
  <text x="560" y="242" text-anchor="middle" font-size="5.2" letter-spacing="1" fill="#7C6D5C" font-weight="400">观 水 必 观 其 澜</text>
  <path d="M 510,404 L 510,384 L 552,384 L 552,364 L 604,364 L 604,344 L 660,344" fill="none" stroke="#DCD5C8" stroke-width="1.1"/>
  <text x="586" y="432" text-anchor="middle" font-size="5.2" letter-spacing="1" fill="#BFB4A4" font-weight="400">不 盈 科 不 行</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">流水之为物也，不盈科不行；君子之志于道也，不成章不达。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 尽心上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图二百零一 · 登东山 · ch201a</text>
