  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">亲 过 大 小</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》告子下　第一百六十四章　MZ164</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="6.0" letter-spacing="1" fill="#BFB4A4" font-weight="400">亲之过大而不怨，是愈疏也；亲之过小而怨，是不可矶也</text>
  <line x1="120" y1="404" x2="660" y2="404" stroke="#8C7B69" stroke-width="1.2"/>
  <path d="M 194.0,404 L 194.0,314 L 214,308 L 234.0,314 L 234.0,404 Z" fill="#FCFAF6" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="197.0" y1="382.88" x2="231.0" y2="382.88" stroke="#7C6D5C" stroke-width="0.6"/>
  <text x="214" y="300" text-anchor="middle" font-size="8.6" letter-spacing="0" fill="#25211D" font-weight="400">小</text>
  <text x="214" y="328" text-anchor="middle" font-size="8.6" letter-spacing="0" fill="#25211D" font-weight="400">弁</text>
  <text x="220" y="424" text-anchor="middle" font-size="5.8" letter-spacing="1" fill="#7C6D5C" font-weight="400">亲之过大</text>
  <circle cx="320" cy="330" r="6" fill="none" stroke="#25211D" stroke-width="1.1"/>
  <line x1="320" y1="336" x2="320" y2="372" stroke="#25211D" stroke-width="1.1"/>
  <line x1="320" y1="372" x2="308" y2="404" stroke="#25211D" stroke-width="0.9"/>
  <line x1="320" y1="372" x2="332" y2="404" stroke="#25211D" stroke-width="0.9"/>
  <text x="320" y="314" text-anchor="middle" font-size="6.4" letter-spacing="2" fill="#994433" font-weight="400">怨</text>
  <path d="M 312,348 q 5,10 8,16" fill="none" stroke="#994433" stroke-width="0.9"/>
  <path d="M 328,348 q 5,10 8,16" fill="none" stroke="#994433" stroke-width="0.9"/>
  <path d="M 493.0,404 L 493.0,338 L 510,332 L 527.0,338 L 527.0,404 Z" fill="#FCFAF6" stroke="#BFB4A4" stroke-width="1.0"/>
  <line x1="496.0" y1="388.16" x2="524.0" y2="388.16" stroke="#BFB4A4" stroke-width="0.5"/>
  <text x="510" y="356" text-anchor="middle" font-size="7.0" letter-spacing="0" fill="#BFB4A4" font-weight="400">凯</text>
  <text x="510" y="378" text-anchor="middle" font-size="7.0" letter-spacing="0" fill="#BFB4A4" font-weight="400">风</text>
  <text x="520" y="424" text-anchor="middle" font-size="5.8" letter-spacing="1" fill="#BFB4A4" font-weight="400">亲之过小</text>
  <circle cx="600" cy="356" r="5.4" fill="none" stroke="#25211D" stroke-width="1.0"/>
  <line x1="600" y1="361" x2="600" y2="390" stroke="#25211D" stroke-width="1.0"/>
  <line x1="600" y1="390" x2="590" y2="404" stroke="#25211D" stroke-width="0.9"/>
  <line x1="600" y1="390" x2="610" y2="404" stroke="#25211D" stroke-width="0.9"/>
  <line x1="600" y1="366" x2="616" y2="372" stroke="#25211D" stroke-width="0.9"/>
  <line x1="600" y1="366" x2="584" y2="372" stroke="#25211D" stroke-width="0.9"/>
  <text x="600" y="340" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#BFB4A4" font-weight="400">不怨</text>
  <text x="380" y="214" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#BFB4A4" font-weight="400">愈疏，不孝也；不可矶，亦不孝也</text>
  <text x="380" y="250" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#994433" font-weight="400">舜五十而慕</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">固哉，高叟之为诗也！</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 告子下</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图一百六十四 · 亲过大小 · ch164a</text>
