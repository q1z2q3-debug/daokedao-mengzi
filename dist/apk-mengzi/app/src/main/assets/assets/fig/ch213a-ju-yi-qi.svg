  <text x="556" y="428" text-anchor="middle" font-size="5.6" letter-spacing="1" fill="#BFB4A4" font-weight="400">养 移 体</text>
  <text x="380" y="196" text-anchor="middle" font-size="6.4" letter-spacing="2" fill="#25211D" font-weight="400">夫 非 尽 人 之 子 与</text>
  <text x="380" y="246" text-anchor="middle" font-size="4.9" letter-spacing="1" fill="#BFB4A4" font-weight="400">同 为 人 子，气 体 不 同</text>
