  <circle cx="556" cy="291.15" r="9.15" fill="none" stroke="#BFB4A4" stroke-width="1.0"/>
  <line x1="556" y1="300.3" x2="556" y2="312.5" stroke="#BFB4A4" stroke-width="1.2"/>
  <path d="M 549.9,312.5 L 531.6,329.58 L 526.72,404 L 585.28,404 L 580.4,329.58 L 562.1,312.5 Z" fill="None" stroke="#BFB4A4" stroke-width="1.0"/>
