  <text x="206" y="428" text-anchor="middle" font-size="5.2" letter-spacing="1" fill="#BFB4A4" font-weight="400">王 子 宫 室</text>
  <circle cx="380" cy="291.15" r="9.15" fill="none" stroke="#25211D" stroke-width="1.2"/>
