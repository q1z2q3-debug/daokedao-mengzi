<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">不 亮 无 执</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》告子下　第一百七十三章　MZ173</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="6.8" letter-spacing="2" fill="#BFB4A4" font-weight="400">君子不亮，恶乎执？</text>
  <line x1="120" y1="404" x2="660" y2="404" stroke="#8C7B69" stroke-width="1.2"/>
  <line x1="228" y1="404" x2="228" y2="300" stroke="#8C7B69" stroke-width="1.1"/>
  <line x1="308" y1="404" x2="308" y2="300" stroke="#8C7B69" stroke-width="1.1"/>
  <line x1="220" y1="300" x2="316" y2="300" stroke="#8C7B69" stroke-width="1.3"/>
  <line x1="268" y1="300" x2="268" y2="340" stroke="#8C7B69" stroke-width="0.8"/>
  <rect x="257" y="340" width="22" height="18" fill="#F0EBE2" stroke="#7C6D5C" stroke-width="1.1"/>
  <line x1="468" y1="404" x2="468" y2="300" stroke="#8C7B69" stroke-width="1.1"/>
  <line x1="548" y1="404" x2="548" y2="300" stroke="#8C7B69" stroke-width="1.1"/>
  <line x1="460" y1="300" x2="496" y2="300" stroke="#8C7B69" stroke-width="1.3"/>
  <line x1="520" y1="300" x2="556" y2="300" stroke="#8C7B69" stroke-width="1.3"/>
  <path d="M 496,300 L 492,288" fill="none" stroke="#8C7B69" stroke-width="0.9"/>
  <path d="M 520,300 L 524,312" fill="none" stroke="#8C7B69" stroke-width="0.9"/>
  <path d="M 508,300 L 508,404" fill="none" stroke="#DCD5C8" stroke-width="0.8" stroke-dasharray="3,3"/>
  <rect x="497" y="386" width="22" height="18" fill="#F0EBE2" stroke="#7C6D5C" stroke-width="1.1"/>
  <text x="268" y="424" text-anchor="middle" font-size="5.6" letter-spacing="1" fill="#7C6D5C" font-weight="400">亮 而 后 执</text>
  <text x="508" y="424" text-anchor="middle" font-size="5.6" letter-spacing="1" fill="#994433" font-weight="400">不 亮</text>
  <text x="268" y="274" text-anchor="middle" font-size="5.2" letter-spacing="0" fill="#BFB4A4" font-weight="400">所执有信</text>
  <text x="508" y="274" text-anchor="middle" font-size="5.2" letter-spacing="0" fill="#BFB4A4" font-weight="400">所执无信</text>
  <text x="388" y="250" text-anchor="middle" font-size="6.0" letter-spacing="2" fill="#994433" font-weight="400">恶乎执</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">亮，信也，与谅同。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 告子下</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图八十四 · 不亮无执 · ch173a</text>
</svg>
