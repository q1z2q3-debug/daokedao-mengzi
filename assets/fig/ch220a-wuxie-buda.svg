  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">五 挟 不 答</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》尽心上　第二百二十章　MZ220</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="5.7" letter-spacing="1" fill="#BFB4A4" font-weight="400">挟贵、挟贤、挟长、挟勋劳、挟故而问，皆所不答也</text>
  <line x1="120" y1="404" x2="660" y2="404" stroke="#8C7B69" stroke-width="1.2"/>
  <text x="380" y="164" text-anchor="middle" font-size="6.0" letter-spacing="2" fill="#25211D" font-weight="400">有 所 挟，则 受 道 之 心 不 专</text>
  <rect x="136" y="344" width="70" height="60" fill="#F0EBE2" stroke="#8C7B69" stroke-width="1.1"/>
  <text x="171" y="386" text-anchor="middle" font-size="10.5" letter-spacing="0" fill="#7C6D5C" font-weight="400">贵</text>
  <text x="171" y="332" text-anchor="middle" font-size="5.2" letter-spacing="1" fill="#BFB4A4" font-weight="400">挟</text>
  <rect x="222" y="344" width="70" height="60" fill="#F0EBE2" stroke="#8C7B69" stroke-width="1.1"/>
  <text x="257" y="386" text-anchor="middle" font-size="10.5" letter-spacing="0" fill="#7C6D5C" font-weight="400">贤</text>
  <text x="257" y="332" text-anchor="middle" font-size="5.2" letter-spacing="1" fill="#BFB4A4" font-weight="400">挟</text>
  <rect x="462" y="344" width="70" height="60" fill="#F0EBE2" stroke="#8C7B69" stroke-width="1.1"/>
  <text x="497" y="386" text-anchor="middle" font-size="10.5" letter-spacing="0" fill="#7C6D5C" font-weight="400">长</text>
  <text x="497" y="332" text-anchor="middle" font-size="5.2" letter-spacing="1" fill="#BFB4A4" font-weight="400">挟</text>
  <rect x="548" y="344" width="70" height="60" fill="#F0EBE2" stroke="#8C7B69" stroke-width="1.1"/>
  <text x="583" y="386" text-anchor="middle" font-size="10.5" letter-spacing="0" fill="#7C6D5C" font-weight="400">勋</text>
  <text x="583" y="332" text-anchor="middle" font-size="5.2" letter-spacing="1" fill="#BFB4A4" font-weight="400">挟</text>
  <rect x="634" y="344" width="70" height="60" fill="#F0EBE2" stroke="#8C7B69" stroke-width="1.1"/>
  <text x="669" y="386" text-anchor="middle" font-size="10.5" letter-spacing="0" fill="#7C6D5C" font-weight="400">故</text>
  <text x="669" y="332" text-anchor="middle" font-size="5.2" letter-spacing="1" fill="#BFB4A4" font-weight="400">挟</text>
  <circle cx="380" cy="296.7" r="8.7" fill="none" stroke="#25211D" stroke-width="1.3"/>
  <line x1="380" y1="305.4" x2="380" y2="376.16" stroke="#25211D" stroke-width="1.625"/>
  <line x1="380" y1="319.32" x2="361.44" y2="344.84" stroke="#25211D" stroke-width="1.3"/>
  <line x1="380" y1="319.32" x2="398.56" y2="344.84" stroke="#25211D" stroke-width="1.3"/>
  <line x1="380" y1="376.16" x2="369.56" y2="404" stroke="#25211D" stroke-width="1.3"/>
  <line x1="380" y1="376.16" x2="390.44" y2="404" stroke="#25211D" stroke-width="1.3"/>
  <text x="438" y="330" text-anchor="middle" font-size="6.0" letter-spacing="1" fill="#994433" font-weight="400">不 答</text>
  <circle cx="179" cy="356" r="2.6" fill="#994433" stroke="#994433" stroke-width="1.0"/>
  <circle cx="265" cy="356" r="2.6" fill="#994433" stroke="#994433" stroke-width="1.0"/>
  <text x="214" y="424" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#994433" font-weight="400">滕 更 有 二 焉</text>
  <text x="600" y="424" text-anchor="middle" font-size="4.6" letter-spacing="1" fill="#BFB4A4" font-weight="400">挟 者 五，一 无 所 受</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">挟贵而问，挟贤而问，皆所不答也。滕更有二焉。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 尽心上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图一百三十一 · 五挟不答 · ch220a</text>
