  <text x="532" y="336" text-anchor="middle" font-size="7.4" letter-spacing="2" fill="#BFB4A4" font-weight="400">穷 居</text>
  <line x1="176" y1="428" x2="228" y2="428" stroke="#BFB4A4" stroke-width="0.8"/>
  <line x1="228" y1="428" x2="228" y2="396" stroke="#BFB4A4" stroke-width="0.8"/>
  <line x1="532" y1="428" x2="584" y2="428" stroke="#BFB4A4" stroke-width="0.8"/>
  <line x1="532" y1="428" x2="532" y2="396" stroke="#BFB4A4" stroke-width="0.8"/>
  <text x="430" y="396" text-anchor="middle" font-size="5.4" letter-spacing="2" fill="#7C6D5C" font-weight="400">分 定</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">虽大行不加焉，虽穷居不损焉，分定故也。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 尽心上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图一百〇九 · 所性 · ch198a</text>
