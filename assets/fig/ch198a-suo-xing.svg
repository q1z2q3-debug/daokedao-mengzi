  <line x1="380" y1="333.91999999999996" x2="364.64" y2="355.03999999999996" stroke="#25211D" stroke-width="1.2"/>
  <line x1="380" y1="333.91999999999996" x2="395.36" y2="355.03999999999996" stroke="#25211D" stroke-width="1.2"/>
  <line x1="380" y1="380.96" x2="371.36" y2="404" stroke="#25211D" stroke-width="1.2"/>
