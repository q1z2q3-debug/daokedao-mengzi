  <text x="397" y="206" text-anchor="middle" font-size="6.2" letter-spacing="0" fill="#25211D" font-weight="400">义</text>
  <text x="363" y="232" text-anchor="middle" font-size="6.2" letter-spacing="0" fill="#25211D" font-weight="400">礼</text>
  <text x="397" y="232" text-anchor="middle" font-size="6.2" letter-spacing="0" fill="#25211D" font-weight="400">智</text>
  <path d="M 380,250 L 380,300" fill="none" stroke="#BFB4A4" stroke-width="0.9" stroke-dasharray="3,3"/>
  <text x="424" y="284" text-anchor="middle" font-size="5.0" letter-spacing="1" fill="#7C6D5C" font-weight="400">根 于 心</text>
  <circle cx="228" cy="330" r="62" fill="#FCFAF6" stroke="#DCD5C8" stroke-width="1.0"/>
  <circle cx="532" cy="330" r="62" fill="#FCFAF6" stroke="#DCD5C8" stroke-width="1.0"/>
