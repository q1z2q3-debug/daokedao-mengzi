  <text x="380" y="250" text-anchor="middle" font-size="5.0" letter-spacing="2" fill="#7C6D5C" font-weight="400">三 宝：所守·所养·所理</text>
  <text x="380" y="292" text-anchor="middle" font-size="5.4" letter-spacing="1.4" fill="#994433" font-weight="400">宝珠玉者，殃必及身</text>
