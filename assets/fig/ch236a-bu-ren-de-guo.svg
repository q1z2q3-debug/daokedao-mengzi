<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">不 仁 得 国</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》尽心下　第二百三十六章　MZ236</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="6.0" letter-spacing="1.4" fill="#7C6D5C" font-weight="400">不仁而得国者，有之矣；不仁而得天下，未之有也</text>
  <rect x="150" y="288" width="108" height="52" fill="#F0EBE2" stroke="#7C6D5C" stroke-width="1.3"/>
  <text x="204.0" y="317.6" text-anchor="middle" font-size="9.0" letter-spacing="2" fill="#7C6D5C" font-weight="400">国</text>
  <line x1="324" y1="286" x2="266" y2="298" stroke="#25211D" stroke-width="1.5"/>
  <line x1="266" y1="298" x2="258" y2="290" stroke="#25211D" stroke-width="1.1"/>
  <line x1="266" y1="298" x2="256" y2="300" stroke="#25211D" stroke-width="1.1"/>
  <line x1="266" y1="298" x2="260" y2="306" stroke="#25211D" stroke-width="1.1"/>
  <text x="216" y="272" text-anchor="middle" font-size="5.0" letter-spacing="1" fill="#8C7B69" font-weight="400">私智</text>
  <text x="204" y="356" text-anchor="middle" font-size="5.2" letter-spacing="1" fill="#994433" font-weight="400">可盗</text>
  <circle cx="556" cy="300" r="78" fill="none" stroke="#25211D" stroke-width="1.3"/>
  <line x1="506" y1="300" x2="606" y2="300" stroke="#BFB4A4" stroke-width="0.9"/>
  <text x="556" y="268" text-anchor="middle" font-size="6.4" letter-spacing="3" fill="#7C6D5C" font-weight="400">天下</text>
  <text x="556" y="392" text-anchor="middle" font-size="5.2" letter-spacing="1" fill="#8C7B69" font-weight="400">丘民之心</text>
  <path d="M 318,300 L 388,300" fill="none" stroke="#DCD5C8" stroke-width="1.0" stroke-dasharray="6,4"/>
  <path d="M 418,300 L 470,300" fill="none" stroke="#DCD5C8" stroke-width="1.0" stroke-dasharray="6,4"/>
  <text x="404" y="288" text-anchor="middle" font-size="6.4" letter-spacing="2" fill="#994433" font-weight="400">未 之 有</text>
  <text x="380.0" y="424" text-anchor="middle" font-size="6.0" letter-spacing="2" fill="#7C6D5C" font-weight="400">得而复失，犹不得也</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">小国可以盗，天下只能得。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 离娄上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图一百四十七 · 不仁得国 · ch236a</text>
</svg>
