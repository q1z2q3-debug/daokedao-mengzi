  <text x="380" y="186" text-anchor="middle" font-size="5.0" letter-spacing="1" fill="#BFB4A4" font-weight="400">形 色 · 天 性</text>
  <circle cx="380" cy="233.2" r="13.2" fill="none" stroke="#25211D" stroke-width="1.3"/>
  <line x1="380" y1="246.4" x2="380" y2="353.76" stroke="#25211D" stroke-width="1.625"/>
  <line x1="380" y1="267.52" x2="351.84" y2="306.24" stroke="#25211D" stroke-width="1.3"/>
