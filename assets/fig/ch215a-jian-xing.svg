  <text x="486" y="300" text-anchor="middle" font-size="7.0" letter-spacing="1" fill="#7C6D5C" font-weight="400">践</text>
  <text x="486" y="320" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#BFB4A4" font-weight="400">尽 其 理</text>
  <text x="520" y="376" text-anchor="middle" font-size="4.6" letter-spacing="1" fill="#BFB4A4" font-weight="400">众 人 有 是 形</text>
  <text x="520" y="392" text-anchor="middle" font-size="4.6" letter-spacing="1" fill="#BFB4A4" font-weight="400">而 不 能 尽 其 理</text>
