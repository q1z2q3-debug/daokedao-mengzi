  <line x1="300" y1="378.15999999999997" x2="314" y2="404" stroke="#25211D" stroke-width="1.1"/>
  <line x1="300" y1="344.0" x2="288" y2="366.0" stroke="#25211D" stroke-width="0.9900000000000001"/>
  <line x1="300" y1="344.0" x2="312" y2="366.0" stroke="#25211D" stroke-width="0.9900000000000001"/>
  <line x1="318" y1="350" x2="344" y2="336" stroke="#25211D" stroke-width="0.9"/>
  <circle cx="347" cy="334" r="4.0" fill="none" stroke="#7C6D5C" stroke-width="0.8"/>
  <text x="300" y="292" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#7C6D5C" font-weight="400">舜</text>
  <path d="M 340,372 C 392,372 396,318 452,318" fill="none" stroke="#994433" stroke-width="1.1" stroke-dasharray="5,3"/>
  <text x="384" y="386" text-anchor="middle" font-size="5.8" letter-spacing="0" fill="#994433" font-weight="400">不告</text>
  <text x="380" y="424" text-anchor="middle" font-size="5.8" letter-spacing="0" fill="#BFB4A4" font-weight="400">告则废人之大伦，以怼父母，是以不告也</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">是以不告也。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 万章上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图三十六 · 不告而娶 · ch125a</text>
