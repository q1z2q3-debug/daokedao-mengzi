  <line x1="590" y1="292" x2="598" y2="300" stroke="#8C7B69" stroke-width="1.0"/>
  <line x1="424" y1="290" x2="604" y2="290" stroke="#8C7B69" stroke-width="1.2"/>
  <rect x="470" y="316" width="60" height="76" fill="#F0EBE2" stroke="#8C7B69" stroke-width="0.9"/>
  <text x="515" y="284" text-anchor="middle" font-size="5.8" letter-spacing="0" fill="#7C6D5C" font-weight="400">父母之门</text>
  <circle cx="300" cy="333.0" r="5.0" fill="none" stroke="#25211D" stroke-width="1.1"/>
  <line x1="300" y1="338.0" x2="300" y2="378.15999999999997" stroke="#25211D" stroke-width="1.1"/>
