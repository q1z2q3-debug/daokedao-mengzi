  <text x="384" y="300" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#994433" font-weight="400">修天爵而人爵从之</text>
  <path d="M 470,352 L 316,352" fill="none" stroke="#BFB4A4" stroke-width="0.9" stroke-dasharray="4,3"/>
  <text x="384" y="372" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">今人修天爵以要人爵</text>
  <text x="380" y="214" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">既得人爵，而弃其天爵，则惑之甚者也</text>
