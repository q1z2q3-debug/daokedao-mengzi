  <text x="380" y="106" text-anchor="middle" font-size="8.6" letter-spacing="3" fill="#25211D">明堂　王者所居，出政令之所</text>

  <line x1="380" y1="212" x2="380" y2="266" stroke="#994433" stroke-width="1.3"/>
  <polygon points="380,280 373,264 387,264" fill="#994433"/>
  <text x="396" y="240" font-size="8" letter-spacing="1" fill="#994433">与百姓同之</text>
  <text x="380" y="300" text-anchor="middle" font-size="7" fill="#7C6D5C">天理所有，人情不能无；同行异情</text>

  <circle cx="224" cy="360" r="36" fill="#FCFAF6" stroke="#994433" stroke-width="1.2"/>
  <text x="224" y="366" text-anchor="middle" font-size="12" letter-spacing="2" fill="#994433">货</text>
  <text x="224" y="414" text-anchor="middle" font-size="7" fill="#7C6D5C">公刘：居者有积仓</text>
  <text x="224" y="428" text-anchor="middle" font-size="7" fill="#7C6D5C">行者有裹粮</text>

  <circle cx="380" cy="360" r="36" fill="#FCFAF6" stroke="#994433" stroke-width="1.2"/>
  <text x="380" y="366" text-anchor="middle" font-size="12" letter-spacing="2" fill="#994433">色</text>
  <text x="380" y="414" text-anchor="middle" font-size="7" fill="#7C6D5C">太王：内无怨女</text>
  <text x="380" y="428" text-anchor="middle" font-size="7" fill="#7C6D5C">外无旷夫</text>

  <circle cx="536" cy="360" r="36" fill="#FCFAF6" stroke="#994433" stroke-width="1.2"/>
  <text x="536" y="366" text-anchor="middle" font-size="12" letter-spacing="2" fill="#994433">勇</text>
  <text x="536" y="414" text-anchor="middle" font-size="7" fill="#7C6D5C">一怒而安</text>
  <text x="536" y="428" text-anchor="middle" font-size="7" fill="#7C6D5C">天下之民</text>
  <line x1="120" y1="456" x2="640" y2="456" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="480" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D">欲望不是政的敌人，私才是。</text>
  <text x="120" y="514" font-size="5.6" fill="#7C6D5C">孟子 · 梁惠王下</text>
  <text x="640" y="514" text-anchor="end" font-size="5.6" fill="#7C6D5C">图十二 · 明堂与三欲 · ch12a</text>
