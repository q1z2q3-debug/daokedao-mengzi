  <text x="430" y="236" text-anchor="middle" font-size="6.0" letter-spacing="2" fill="#994433" font-weight="400">以意逆之</text>
  <text x="380" y="424" text-anchor="middle" font-size="5.8" letter-spacing="0" fill="#BFB4A4" font-weight="400">以己意迎取作者之志，乃可得之</text>
