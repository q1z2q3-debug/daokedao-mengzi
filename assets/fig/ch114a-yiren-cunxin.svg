<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">以 仁 存 心</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》离娄下　第一百一十四章　MZ114</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="6.6" letter-spacing="1" fill="#BFB4A4" font-weight="400">君子以仁存心，以礼存心</text>
  <line x1="96" y1="404" x2="664" y2="404" stroke="#8C7B69" stroke-width="1.3"/>
  <path d="M 380,300 C 350,270 300,296 322,330 C 340,356 380,382 380,382 C 380,382 420,356 438,330 C 460,296 410,270 380,300 Z" fill="#F0EBE2" stroke="#994433" stroke-width="1.2"/>
  <text x="380" y="344" text-anchor="middle" font-size="9.0" letter-spacing="0" fill="#994433" font-weight="400">仁</text>
  <line x1="180" y1="300" x2="306" y2="300" stroke="#BFB4A4" stroke-width="1.0"/>
  <path d="M 302.1,302.3 L 306,300 L 302.1,297.7" fill="none" stroke="#BFB4A4" stroke-width="0.9"/>
  <line x1="180" y1="340" x2="300" y2="336" stroke="#BFB4A4" stroke-width="1.0"/>
  <path d="M 296.2,338.4 L 300,336 L 296.1,333.8" fill="none" stroke="#BFB4A4" stroke-width="0.9"/>
  <line x1="180" y1="380" x2="322" y2="366" stroke="#BFB4A4" stroke-width="1.0"/>
  <path d="M 318.4,368.7 L 322,366 L 317.9,364.1" fill="none" stroke="#BFB4A4" stroke-width="0.9"/>
  <text x="232" y="288" text-anchor="middle" font-size="6.0" letter-spacing="2" fill="#BFB4A4" font-weight="400">横逆</text>
  <text x="232" y="400" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#BFB4A4" font-weight="400">其待我以横逆</text>
  <line x1="468" y1="330" x2="560" y2="330" stroke="#994433" stroke-width="1.0"/>
  <path d="M 556.1,332.3 L 560,330 L 556.1,327.7" fill="none" stroke="#994433" stroke-width="0.9"/>
  <text x="516" y="318" text-anchor="middle" font-size="6.0" letter-spacing="2" fill="#994433" font-weight="400">自反</text>
  <text x="516" y="352" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">不仁？无礼？不忠？</text>
  <text x="380" y="258" text-anchor="middle" font-size="6.2" letter-spacing="4" fill="#7C6D5C" font-weight="400">存 心</text>
  <text x="380" y="424" text-anchor="middle" font-size="6.2" letter-spacing="0" fill="#BFB4A4" font-weight="400">君子有终身之忧，无一朝之患</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">君子以仁存心，以礼存心。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 离娄下</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图二十五 · 以仁存心 · ch114a</text>
