<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">进 锐 退 速</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》尽心上　第二百二十一章　MZ221</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="5.6" letter-spacing="1" fill="#BFB4A4" font-weight="400">于不可已而已者，无所不已；于所厚者薄，无所不薄也</text>
  <line x1="120" y1="404" x2="660" y2="404" stroke="#8C7B69" stroke-width="1.2"/>
  <text x="380" y="168" text-anchor="middle" font-size="6.2" letter-spacing="2" fill="#25211D" font-weight="400">三 者 之 弊，同 归 于 废 弛</text>
  <line x1="140" y1="368" x2="196" y2="368" stroke="#8C7B69" stroke-width="1.3"/>
  <line x1="140" y1="390" x2="196" y2="390" stroke="#8C7B69" stroke-width="1.3"/>
  <line x1="216" y1="368" x2="272" y2="368" stroke="#8C7B69" stroke-width="1.3"/>
  <line x1="216" y1="390" x2="272" y2="390" stroke="#8C7B69" stroke-width="1.3"/>
  <line x1="196" y1="366" x2="196" y2="392" stroke="#DCD5C8" stroke-width="0.9"/>
  <line x1="216" y1="366" x2="216" y2="392" stroke="#DCD5C8" stroke-width="0.9"/>
  <text x="206" y="384" text-anchor="middle" font-size="6.6" letter-spacing="1" fill="#994433" font-weight="400">止</text>
  <text x="206" y="424" text-anchor="middle" font-size="4.9" letter-spacing="1" fill="#25211D" font-weight="400">于 不 可 已 而 已</text>
  <path d="M 312,392 L 392,248 L 472,394" fill="none" stroke="#994433" stroke-width="1.4"/>
  <circle cx="392" cy="248" r="4" fill="#994433" stroke="#994433" stroke-width="1.0"/>
  <text x="392" y="232" text-anchor="middle" font-size="6.4" letter-spacing="1" fill="#994433" font-weight="400">锐</text>
  <text x="392" y="424" text-anchor="middle" font-size="4.9" letter-spacing="1" fill="#25211D" font-weight="400">其 进 锐 者，其 退 速</text>
  <rect x="512" y="336" width="104" height="22" fill="#F0EBE2" stroke="#8C7B69" stroke-width="1.1"/>
  <rect x="512" y="378" width="104" height="12" fill="#F0EBE2" stroke="#8C7B69" stroke-width="1.1"/>
  <text x="500" y="352" text-anchor="end" font-size="5.4" letter-spacing="1" fill="#7C6D5C" font-weight="400">厚</text>
  <text x="500" y="392" text-anchor="end" font-size="5.4" letter-spacing="1" fill="#7C6D5C" font-weight="400">薄</text>
  <text x="564" y="424" text-anchor="middle" font-size="4.9" letter-spacing="1" fill="#25211D" font-weight="400">于 所 厚 者 薄</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">其进锐者，其退速。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 尽心上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图一百三十二 · 进锐退速 · ch221a</text>
</svg>
