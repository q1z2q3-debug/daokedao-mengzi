  <text x="536" y="208" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#994433" font-weight="400">取其一</text>
  <text x="200" y="250" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">万室之国</text>
  <text x="200" y="272" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">一人陶，则可乎？</text>
  <text x="560" y="300" text-anchor="middle" font-size="5.2" letter-spacing="0" fill="#BFB4A4" font-weight="400">貉：五谷不生</text>
  <text x="560" y="320" text-anchor="middle" font-size="5.2" letter-spacing="0" fill="#BFB4A4" font-weight="400">无城郭宫室宗庙</text>
  <text x="560" y="340" text-anchor="middle" font-size="5.2" letter-spacing="0" fill="#BFB4A4" font-weight="400">无诸侯币帛饔飧</text>
