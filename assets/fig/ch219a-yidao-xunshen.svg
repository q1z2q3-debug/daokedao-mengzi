  <text x="524" y="372" text-anchor="middle" font-size="4.7" letter-spacing="1" fill="#994433" font-weight="400">道 屈 则 身 在 必 退</text>
  <path d="M 180,428 L 568,428" fill="none" stroke="#DCD5C8" stroke-width="0.9" stroke-dasharray="4,4"/>
  <text x="380" y="434" text-anchor="middle" font-size="4.8" letter-spacing="1" fill="#BFB4A4" font-weight="400">未 闻 以 道 殉 乎 人 者 也</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">天下有道，以道殉身；天下无道，以身殉道。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 尽心上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图一百三十 · 以道殉身 · ch219a</text>
