  <line x1="262" y1="346" x2="366" y2="346" stroke="#7C6D5C" stroke-width="1.1"/>
  <path d="M 362.6,348.1 L 366,346 L 362.6,343.9" fill="none" stroke="#7C6D5C" stroke-width="0.9900000000000001"/>
  <text x="226" y="424" text-anchor="middle" font-size="5.4" letter-spacing="1" fill="#7C6D5C" font-weight="400">以 道 殉 身</text>
  <text x="236" y="372" text-anchor="middle" font-size="4.7" letter-spacing="1" fill="#7C6D5C" font-weight="400">身 出 则 道 在 必 行</text>
  <text x="552" y="202" text-anchor="middle" font-size="5.2" letter-spacing="1" fill="#BFB4A4" font-weight="400">天 下 无 道</text>
  <circle cx="534" cy="302.25" r="8.25" fill="none" stroke="#25211D" stroke-width="1.2"/>
  <line x1="534" y1="310.5" x2="534" y2="377.6" stroke="#25211D" stroke-width="1.5"/>
