  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">以 道 殉 身</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》尽心上　第二百一十九章　MZ219</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="5.9" letter-spacing="1" fill="#BFB4A4" font-weight="400">天下有道，以道殉身；天下无道，以身殉道</text>
  <line x1="120" y1="404" x2="660" y2="404" stroke="#8C7B69" stroke-width="1.2"/>
  <text x="380" y="162" text-anchor="middle" font-size="6.2" letter-spacing="2" fill="#25211D" font-weight="400">殉 者，以 死 随 物 之 名</text>
  <path d="M 380,200 L 380,366" fill="none" stroke="#25211D" stroke-width="1.3"/>
  <text x="380" y="388" text-anchor="middle" font-size="7.4" letter-spacing="1" fill="#7C6D5C" font-weight="400">道</text>
  <text x="206" y="202" text-anchor="middle" font-size="5.2" letter-spacing="1" fill="#BFB4A4" font-weight="400">天 下 有 道</text>
  <circle cx="226" cy="302.25" r="8.25" fill="none" stroke="#25211D" stroke-width="1.2"/>
  <line x1="226" y1="310.5" x2="226" y2="377.6" stroke="#25211D" stroke-width="1.5"/>
