<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif">
  <rect x="0" y="0" width="760" height="480" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="460" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="448" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>

  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="6" fill="#25211D" font-weight="700">五 十 步 与 百 步</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C">《孟子》梁惠王上　第三章　MZ003</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>

  <line x1="140" y1="176" x2="140" y2="308" stroke="#25211D" stroke-width="1.6"/>
  <text x="140" y="168" text-anchor="middle" font-size="7" letter-spacing="2" fill="#25211D">前　线</text>

  <line x1="140" y1="200" x2="640" y2="200" stroke="#BFB4A4" stroke-width="1.4" stroke-dasharray="9 4"/>
  <circle cx="640" cy="200" r="7" fill="none" stroke="#8C7B69" stroke-width="1.4"/>
  <text x="640" y="184" text-anchor="middle" font-size="9.5" letter-spacing="2" fill="#8C7B69">百步</text>
  <text x="640" y="220" text-anchor="middle" font-size="6.5" fill="#8C7B69">止于此</text>

  <line x1="140" y1="290" x2="380" y2="290" stroke="#994433" stroke-width="1.8"/>
  <circle cx="380" cy="290" r="7" fill="none" stroke="#994433" stroke-width="1.4"/>
  <text x="380" y="274" text-anchor="middle" font-size="9.5" letter-spacing="2" fill="#994433">五十步</text>
  <text x="380" y="310" text-anchor="middle" font-size="6.5" fill="#994433">止于此</text>

  <circle cx="140" cy="245" r="4.5" fill="#25211D"/>
  <text x="130" y="262" text-anchor="end" font-size="7" fill="#7C6D5C">同一起点</text>

  <path d="M 392,282 C 470,304 560,252 624,208" fill="none" stroke="#994433" stroke-width="1.3"/>
  <polygon points="626,203 615,204 620,214" fill="#994433"/>
  <text x="512" y="252" text-anchor="middle" font-size="11" letter-spacing="2" fill="#994433">笑</text>
  <text x="512" y="268" text-anchor="middle" font-size="6.5" fill="#7C6D5C">回头指他</text>

  <text x="252" y="244" text-anchor="middle" font-size="8.4" letter-spacing="2" fill="#25211D">同为走也</text>

  <text x="380" y="340" text-anchor="middle" font-size="7.4" fill="#7C6D5C">退得远些，退得近些——都没有往前去过一步。</text>

  <line x1="120" y1="378" x2="640" y2="378" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="404" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D">直不百步耳，是亦走也。</text>
  <text x="380" y="426" text-anchor="middle" font-size="7.4" fill="#7C6D5C">故曰：无望民之多于邻国也。</text>
  <text x="120" y="458" font-size="5.6" fill="#7C6D5C">孟子 · 梁惠王上</text>
  <text x="640" y="458" text-anchor="end" font-size="5.6" fill="#7C6D5C">图三 · 五十步与百步 · ch03a</text>
</svg>
