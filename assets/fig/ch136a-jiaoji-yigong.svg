<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">交 际 以 恭</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》万章下　第一百三十六章　MZ136</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="6.6" letter-spacing="1" fill="#BFB4A4" font-weight="400">其交也以道，其接也以礼</text>
  <rect x="172.0" y="354" width="96" height="50" fill="#F0EBE2" stroke="#8C7B69" stroke-width="1.2"/>
  <line x1="180.0" y1="354" x2="180.0" y2="404" stroke="#7C6D5C" stroke-width="0.7"/>
  <line x1="208.0" y1="354" x2="208.0" y2="404" stroke="#7C6D5C" stroke-width="0.7"/>
  <line x1="236.0" y1="354" x2="236.0" y2="404" stroke="#7C6D5C" stroke-width="0.7"/>
  <ellipse cx="204" cy="350" rx="16" ry="6" fill="#FCFAF6" stroke="#8C7B69" stroke-width="1.08"/>
  <ellipse cx="236" cy="350" rx="16" ry="6" fill="#FCFAF6" stroke="#8C7B69" stroke-width="1.08"/>
  <text x="220" y="424" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#7C6D5C" font-weight="400">币帛</text>
  <circle cx="560" cy="326" r="6.2" fill="none" stroke="#25211D" stroke-width="1.2"/>
  <line x1="560" y1="332" x2="560" y2="372" stroke="#25211D" stroke-width="1.3"/>
  <line x1="560" y1="372" x2="544" y2="404" stroke="#25211D" stroke-width="1.1"/>
  <line x1="560" y1="372" x2="576" y2="404" stroke="#25211D" stroke-width="1.1"/>
  <line x1="560" y1="344" x2="528" y2="336" stroke="#25211D" stroke-width="1.0"/>
  <line x1="560" y1="344" x2="528" y2="350" stroke="#25211D" stroke-width="1.0"/>
  <text x="560" y="424" text-anchor="middle" font-size="5.6" letter-spacing="0" fill="#7C6D5C" font-weight="400">受</text>
  <path d="M 282,352 L 514,344" fill="none" stroke="#994433" stroke-width="0.9" stroke-dasharray="4,3"/>
  <text x="400" y="326" text-anchor="middle" font-size="6.0" letter-spacing="0" fill="#994433" font-weight="400">却之？</text>
  <text x="380" y="250" text-anchor="middle" font-size="12" letter-spacing="6" fill="#25211D" font-weight="400">恭</text>
  <text x="380" y="276" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">尊者赐之，弗却也</text>
  <line x1="120" y1="404" x2="660" y2="404" stroke="#8C7B69" stroke-width="1.3"/>
  <text x="380" y="428" text-anchor="middle" font-size="5.4" letter-spacing="0" fill="#BFB4A4" font-weight="400">君子可欺以其方：受与不受，先看其道</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">交际何心也？曰：恭也。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 万章下</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图四十七 · 交际以恭 · ch136a</text>
</svg>
