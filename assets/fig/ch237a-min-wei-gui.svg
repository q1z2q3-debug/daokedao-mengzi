<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif">
  <rect x="0" y="0" width="760" height="540" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="500" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="488" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="5" fill="#25211D" font-weight="700">民 为 贵</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C" font-weight="400">《孟子》尽心下　第二百三十七章　MZ237</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" font-size="6.0" letter-spacing="1.6" fill="#7C6D5C" font-weight="400">民为贵，社稷次之，君为轻</text>
  <rect x="320" y="168" width="120" height="26" fill="#F0EBE2" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="320" y1="168" x2="440" y2="168" stroke="#7C6D5C" stroke-width="1.5"/>
  <text x="380.0" y="186" text-anchor="middle" font-size="8.0" letter-spacing="3" fill="#25211D" font-weight="400">君</text>
  <rect x="250" y="194" width="260" height="26" fill="#F0EBE2" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="250" y1="194" x2="510" y2="194" stroke="#7C6D5C" stroke-width="1.5"/>
  <text x="380.0" y="212" text-anchor="middle" font-size="8.0" letter-spacing="3" fill="#25211D" font-weight="400">社 稷</text>
  <rect x="180" y="220" width="400" height="26" fill="#F0EBE2" stroke="#7C6D5C" stroke-width="1.4"/>
  <line x1="180" y1="220" x2="580" y2="220" stroke="#7C6D5C" stroke-width="1.8"/>
  <text x="380" y="240" text-anchor="middle" font-size="11.0" letter-spacing="5" fill="#25211D" font-weight="400">民</text>
  <line x1="180" y1="246" x2="180" y2="404" stroke="#7C6D5C" stroke-width="1.2"/>
  <line x1="180" y1="404" x2="580" y2="404" stroke="#7C6D5C" stroke-width="1.4"/>
  <text x="600" y="178" text-anchor="middle" font-size="4.8" letter-spacing="0" fill="#8C7B69" font-weight="400">系于二者</text>
  <text x="540" y="204" text-anchor="middle" font-size="4.8" letter-spacing="0" fill="#8C7B69" font-weight="400">为民而立</text>
  <text x="380" y="270" text-anchor="middle" font-size="5.2" letter-spacing="1.4" fill="#994433" font-weight="400">得乎丘民而为天子</text>
  <line x1="660" y1="392" x2="660" y2="180" stroke="#994433" stroke-width="1.2"/>
  <path d="M 662.6,184.3 L 660,180 L 657.4,184.3" fill="none" stroke="#994433" stroke-width="1.08"/>
  <text x="688" y="292" text-anchor="middle" font-size="8.0" letter-spacing="1" fill="#994433" font-weight="400">贵</text>
  <text x="380" y="424" text-anchor="middle" font-size="6.2" letter-spacing="1.4" fill="#25211D" font-weight="400">越宽越在下——位置不是权利，是职责</text>
  <line x1="120" y1="436" x2="640" y2="436" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="460" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D" font-weight="400">位置尽不了职，位置就收回。</text>
  <text x="120" y="494" font-size="5.6" fill="#7C6D5C">孟子 · 离娄上</text>
  <text x="640" y="494" text-anchor="end" font-size="5.6" fill="#7C6D5C">图二百三十七 · 民为贵 · ch237a</text>
</svg>
