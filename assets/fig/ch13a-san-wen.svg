<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="'Noto Serif SC','Songti SC','Source Han Serif SC',serif">
  <rect x="0" y="0" width="760" height="500" fill="#F7F4EE"/>
  <rect x="10" y="10" width="740" height="460" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="16" y="16" width="728" height="448" fill="none" stroke="#DCD5C8" stroke-width="0.6"/>
  <text x="380" y="48" text-anchor="middle" font-size="21" letter-spacing="6" fill="#25211D" font-weight="700">三 问 与 一 个 空</text>
  <text x="380" y="68" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#7C6D5C">《孟子》梁惠王下　第十三章　MZ013</text>
  <line x1="120" y1="80" x2="640" y2="80" stroke="#DCD5C8" stroke-width="1"/>
  <rect x="84" y="142" width="186" height="118" fill="#FCFAF6" stroke="#994433" stroke-width="1.2"/>
  <text x="177" y="168" text-anchor="middle" font-size="7" fill="#7C6D5C">托妻子于友而之楚</text>
  <text x="177" y="206" text-anchor="middle" font-size="14" letter-spacing="4" fill="#994433">弃之</text>
  <text x="177" y="232" text-anchor="middle" font-size="7" fill="#7C6D5C">朋友之责</text>

  <rect x="288" y="142" width="186" height="118" fill="#FCFAF6" stroke="#994433" stroke-width="1.2"/>
  <text x="381" y="168" text-anchor="middle" font-size="7" fill="#7C6D5C">士师不能治士</text>
  <text x="381" y="206" text-anchor="middle" font-size="14" letter-spacing="4" fill="#994433">已之</text>
  <text x="381" y="232" text-anchor="middle" font-size="7" fill="#7C6D5C">官吏之责</text>

  <rect x="492" y="142" width="186" height="118" fill="#F7F4EE" stroke="#BFB4A4" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="585" y="168" text-anchor="middle" font-size="7" fill="#8C7B69">四境之内不治</text>
  <text x="585" y="204" text-anchor="middle" font-size="8.6" letter-spacing="1" fill="#8C7B69">顾左右而言他</text>
  <text x="585" y="232" text-anchor="middle" font-size="7" fill="#8C7B69">君之责</text>

  <rect x="84" y="300" width="594" height="15" fill="#FCFAF6" stroke="#25211D" stroke-width="1.1"/>
  <line x1="144" y1="300" x2="144" y2="315" stroke="#25211D" stroke-width="0.8"/>
  <line x1="264" y1="300" x2="264" y2="315" stroke="#25211D" stroke-width="0.8"/>
  <line x1="384" y1="300" x2="384" y2="315" stroke="#25211D" stroke-width="0.8"/>
  <line x1="504" y1="300" x2="504" y2="315" stroke="#25211D" stroke-width="0.8"/>
  <text x="96" y="332" font-size="6.5" fill="#7C6D5C">同一把尺：三段，一格比一格长</text>
  <line x1="678" y1="315" x2="678" y2="292" stroke="#994433" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="674" y="286" text-anchor="end" font-size="6.5" fill="#994433">量到此，停</text>
  <line x1="120" y1="396" x2="640" y2="396" stroke="#DCD5C8" stroke-width="1"/>
  <text x="380" y="420" text-anchor="middle" font-size="8.6" letter-spacing="2" fill="#25211D">尺子量到自己，就停了。</text>
  <text x="120" y="454" font-size="5.6" fill="#7C6D5C">孟子 · 梁惠王下</text>
  <text x="640" y="454" text-anchor="end" font-size="5.6" fill="#7C6D5C">图十三 · 三问与一个空 · ch13a</text>
</svg>
